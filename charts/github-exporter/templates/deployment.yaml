{{- $webConfigFile := "/etc/github-exporter/web/web-config.yml" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "github-exporter.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "github-exporter.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- if .Values.annotations }}
  annotations:
    {{- toYaml .Values.annotations | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "github-exporter.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "github-exporter.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- if .Values.podAnnotations }}
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: github-exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            {{- if not (hasKey .Values.env "LISTEN_PORT") }}
            - name: LISTEN_PORT
              value: {{ .Values.service.port | quote }}
            {{- end }}
            {{- if and .Values.webConfig.enabled (not (hasKey .Values.env "WEB_CONFIG_FILE")) }}
            - name: WEB_CONFIG_FILE
              value: {{ $webConfigFile | quote }}
            {{- end }}
            {{- range $key, $val := .Values.env }}
            - name: {{ $key | quote }}
              value: {{ $val | quote }}
            {{- end }}
          {{- if .Values.envFrom }}
          envFrom:
            {{- toYaml .Values.envFrom | nindent 12 }}
          {{- end }}
          {{- if .Values.webConfig.enabled }}
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            tcpSocket:
              port: http
          {{- else }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          {{- end }}
          {{- if or .Values.extraVolumeMounts .Values.webConfig.enabled }}
          volumeMounts:
            {{- if .Values.webConfig.enabled }}
            - name: web-config
              mountPath: /etc/github-exporter/web
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
      {{- if or .Values.extraVolumes .Values.webConfig.enabled }}
      volumes:
        {{- if .Values.webConfig.enabled }}
        - name: web-config
          secret:
            secretName: {{ required "webConfig.existingSecret is required when webConfig.enabled=true" .Values.webConfig.existingSecret }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
